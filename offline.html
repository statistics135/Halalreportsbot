<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ከመስመር ውጪ</title>
<style>
  :root{
    --bg:#14171A; --panel:#1B1F23; --amber:#F5A623; --text:#ECECE9; --text-2:#9AA3AB; --line-strong:#3A4147;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:'Noto Sans Ethiopic',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .box{max-width:360px;text-align:center;}
  .icon{font-size:56px;margin-bottom:16px;}
  h1{font-size:19px;margin:0 0 10px;}
  p{font-size:13.5px;color:var(--text-2);line-height:1.6;margin:0 0 22px;}
  button{
    font-family:'Noto Sans Ethiopic',sans-serif;font-size:14px;font-weight:600;
    background:var(--amber);color:#241a05;border:none;border-radius:6px;padding:11px 24px;cursor:pointer;
  }
  button:hover{background:#ffb748;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🔌</div>
    <h1>ከኢንተርኔት ጋር አልተገናኘም</h1>
    <p>እባክዎ የኢንተርኔት ግንኙነትዎን ያረጋግጡ እና እንደገና ይሞክሩ። ቀድሞ የተከፈቱ ገፆች ላይ ኢንተርኔት ሳይኖር መስራት ይችላሉ።</p>
    <button onclick="location.reload()">🔄 ደግመው ይሞክሩ</button>
  </div>
</body>
</html>
